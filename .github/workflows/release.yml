name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Must match Developer ID Application team used for distribution signing.
  APPLE_TEAM_ID: 97L93HH6B4
  CODESIGN_IDENTITY: "Developer ID Application: mohamed lounnas (97L93HH6B4)"

jobs:
  build-and-release:
    name: Build SoloFan for macOS
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${BUILD_CERTIFICATE_BASE64:-}" || -z "${P12_PASSWORD:-}" ]]; then
            echo "Missing BUILD_CERTIFICATE_BASE64 or P12_PASSWORD secrets"
            exit 1
          fi
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$(openssl rand -base64 24)}"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build SoloFan
        run: |
          xcodebuild \
            -project fan.xcodeproj \
            -scheme fan \
            -configuration Release \
            -derivedDataPath build \
            clean build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

          BUILT_APP="build/Build/Products/Release/SoloFan.app"

          if [ ! -d "$BUILT_APP" ]; then
            echo "Error: Built app not found at $BUILT_APP"
            find build -name "*.app" -type d
            exit 1
          fi

          mkdir -p release
          cp -R "$BUILT_APP" release/SoloFan.app

      - name: Sign application (Developer ID)
        run: |
          set -euo pipefail
          chmod +x release/SoloFan.app/Contents/MacOS/*

          # Nested helpers must be signed before the app bundle (inside-out).
          for bin in release/SoloFan.app/Contents/Resources/smc-helper release/SoloFan.app/Contents/Resources/smc-write; do
            if [ -f "$bin" ]; then
              codesign --force --options runtime --timestamp --sign "$CODESIGN_IDENTITY" "$bin"
            fi
          done

          codesign --force --deep --options runtime --timestamp --sign "$CODESIGN_IDENTITY" release/SoloFan.app
          codesign --verify --deep --strict --verbose=2 release/SoloFan.app

      - name: Notarize application
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY" > "$KEY_PATH"
          ditto -c -k --keepParent release/SoloFan.app "$RUNNER_TEMP/SoloFan-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/SoloFan-notarize.zip" \
            --key "$KEY_PATH" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait
          xcrun stapler staple release/SoloFan.app
          xcrun stapler validate release/SoloFan.app
          spctl --assess --type execute -vv release/SoloFan.app

      - name: Create ZIP archive
        run: |
          cd release
          zip -r ../solofan-v${{ steps.version.outputs.version }}-macos.zip SoloFan.app -x "*.DS_Store"
          cd ..
          shasum -a 256 solofan-v${{ steps.version.outputs.version }}-macos.zip > solofan-v${{ steps.version.outputs.version }}-macos.zip.sha256

      - name: Create styled DMG
        run: |
          DMG_WIDTH=640
          DMG_HEIGHT=480

          mkdir -p dmg_source/.background
          cp -R release/SoloFan.app dmg_source/
          ln -s /Applications dmg_source/Applications

          sips -z $DMG_HEIGHT $DMG_WIDTH assets/installer_bg.png --out dmg_source/.background/background.png

          hdiutil create -volname "SoloFan" \
            -srcfolder dmg_source \
            -ov -format UDRW \
            -size 200m \
            temp_solofan.dmg

          MOUNT_DIR=$(hdiutil attach -readwrite -noverify temp_solofan.dmg | grep "Volumes" | awk '{print $3}')

          osascript <<EOF || true
          tell application "Finder"
            tell disk "SoloFan"
              open
              set current view of container window to icon view
              set toolbar visible of container window to false
              set statusbar visible of container window to false
              set bounds of container window to {100, 100, $((100 + DMG_WIDTH)), $((100 + DMG_HEIGHT))}
              set viewOptions to the icon view options of container window
              set arrangement of viewOptions to not arranged
              set icon size of viewOptions to 128
              set background picture of viewOptions to file ".background:background.png"
              set position of item "SoloFan.app" of container window to {160, 280}
              set position of item "Applications" of container window to {480, 280}
              close
              open
              update without registering applications
              delay 2
            end tell
          end tell
          EOF

          sync
          hdiutil detach "$MOUNT_DIR" || hdiutil detach "$MOUNT_DIR" -force

          hdiutil convert temp_solofan.dmg \
            -format UDZO \
            -imagekey zlib-level=9 \
            -o solofan-v${{ steps.version.outputs.version }}-macos.dmg

          rm -f temp_solofan.dmg

      - name: Sign and notarize DMG
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          DMG="solofan-v${{ steps.version.outputs.version }}-macos.dmg"
          codesign --force --timestamp --sign "$CODESIGN_IDENTITY" "$DMG"
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          xcrun notarytool submit "$DMG" \
            --key "$KEY_PATH" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait
          xcrun stapler staple "$DMG"
          shasum -a 256 "$DMG" > "${DMG}.sha256"

      - name: Generate release notes
        run: |
          cat > release_notes.md << EOF
          ## SoloFan v${{ steps.version.outputs.version }}

          ### Highlights
          - **Developer ID signed + notarized** — Gatekeeper-ready macOS distribution
          - **Menu bar popover** — Left-click opens the dashboard (lazy content on open)
          - Includes Apple Silicon fan control and die-temp fixes from v1.6.4+

          ### Installation

          **Quick install:**
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/mohamadlounnas/ffan/main/scripts/install.sh | bash
          \`\`\`

          **Manual:**
          1. Download \`solofan-v${{ steps.version.outputs.version }}-macos.dmg\` or ZIP
          2. Drag **SoloFan.app** to /Applications/
          3. Install the helper when prompted

          ### Requirements
          - macOS **26.1** or later
          - Apple Silicon or Intel

          ### SHA256
          \`\`\`
          $(cat solofan-v${{ steps.version.outputs.version }}-macos.zip.sha256)
          $(cat solofan-v${{ steps.version.outputs.version }}-macos.dmg.sha256)
          \`\`\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: SoloFan v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            solofan-v${{ steps.version.outputs.version }}-macos.zip
            solofan-v${{ steps.version.outputs.version }}-macos.zip.sha256
            solofan-v${{ steps.version.outputs.version }}-macos.dmg
            solofan-v${{ steps.version.outputs.version }}-macos.dmg.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (non-tag builds)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: solofan-dev-build
          path: |
            solofan-v${{ steps.version.outputs.version }}-macos.zip
            solofan-v${{ steps.version.outputs.version }}-macos.dmg
          retention-days: 30

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
